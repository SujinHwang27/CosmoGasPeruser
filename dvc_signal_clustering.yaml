# DVC Pipeline for Signal Clustering Analysis
# Usage: dvc repro -f dvc_signal_clustering.yaml

stages:
  stage1_prepare:
    cmd: python scripts/run_stage1.py
    deps:
      - scripts/run_stage1.py
      - src/data.py
      - data/preprocessed/Sherwood_z0.3_inf
      - data/processed/wavelet_db8_l6_d12
    params:
      - stage1
    outs:
      - data/feature_discovery
    metrics:
      - results/signal_clustering_v2/stage1_input_summary.csv:
          cache: false

  stage2_probe:
    cmd: python scripts/run_probe.py --run both
    deps:
      - scripts/run_probe.py
      - src/probe.py
      - data/feature_discovery
    params:
      - stage2
    outs:
      - data/feature_discovery/fingerprints_wavelet.npy
      - data/feature_discovery/fingerprints_raw.npy
    metrics:
      - results/signal_clustering_v2/stage2_separability_vector_summary.csv:
          cache: false

  stage3_cluster:
    cmd: python scripts/run_cluster.py --run both --k 5
    deps:
      - scripts/run_cluster.py
      - src/cluster.py
      - data/feature_discovery/fingerprints_wavelet.npy
      - data/feature_discovery/fingerprints_raw.npy
    params:
      - stage3
    outs:
      - data/feature_discovery/labels_wavelet_k5.npy
      - data/feature_discovery/labels_raw_k5.npy
      - data/feature_discovery/centroids_wavelet_k5.npy
      - data/feature_discovery/centroids_raw_k5.npy
    metrics:
      - results/signal_clustering_v2/sweep_wavelet.csv
      - results/signal_clustering_v2/sweep_raw.csv

  stage4_viz:
    cmd: python scripts/run_viz.py --run both --view all
    deps:
      - scripts/run_viz.py
      - src/viz.py
      - data/feature_discovery/labels_wavelet_k5.npy
      - data/feature_discovery/labels_raw_k5.npy
    params:
      - stage4
    outs:
      - figs/signal_clustering_v2

  stage5_audit:
    cmd: python scripts/run_audit.py
    deps:
      - scripts/run_audit.py
      - src/audit.py
      - data/feature_discovery/labels_wavelet_k5.npy
      - data/feature_discovery/labels_raw_k5.npy
    params:
      - stage5
    metrics:
      - results/signal_clustering_v2/cross_run_contingency_k5.csv
      - results/signal_clustering_v2/cross_run_overlap_summary.csv
      - results/signal_clustering_v2/variance_audit.csv